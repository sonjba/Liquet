[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquet"
version = "0.1.0"
description = "Monthly bank reconciliation: rules match, an agent explains the rest, a person approves."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "raphtory==0.17.0",
    "pyvis==0.3.2",
    "anthropic==1.15.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
liquet = "liquet.cli:main"      # pip install creates the `liquet` command

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]   # only so tests can import scripts/whole_loop.py; scripts are not part of the package
testpaths = ["tests"]